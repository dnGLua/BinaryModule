name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build AOT version
      run: ./build-module.ps1 -Type aot

    - name: Build Managed version
      run: ./build-module.ps1 -Type managed

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binary-modules
        path: |
          bin-aot/
          bin-managed/
        retention-days: 30

  build-cross-platform:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PowerShell
      uses: azure/powershell@v5
      with:
        pwsh: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Managed version (cross-platform)
      run: ./build-module.ps1 -Type managed

    - name: Upload managed artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binary-modules-managed
        path: bin-managed/
        retention-days: 30

  build-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PowerShell (Windows) or use existing (Linux/macOS)
      if: runner.os == 'Windows'
      uses: azure/powershell@v5
      with:
        pwsh: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build native library
      run: ./build-native.ps1 -p ${{ matrix.os == 'ubuntu-latest' && 'linux-x64' || matrix.os == 'windows-latest' && 'windows-x64' || matrix.os == 'macos-latest' && 'osx-x64' }}

    - name: Upload native artifacts
      uses: actions/upload-artifact@v4
      with:
        name: native-library-${{ matrix.os }}
        path: artifacts/
        retention-days: 30
