name: Scheduled Build

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PowerShell (Windows) or use existing (Linux/macOS)
      if: runner.os == 'Windows'
      uses: azure/powershell@v5
      with:
        pwsh: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Managed version
      run: ./build-module.ps1 -Type managed

    - name: Build native libraries
      run: ./build-native.ps1 -p ${{ matrix.os == 'ubuntu-latest' && 'linux-x64' || matrix.os == 'windows-latest' && 'windows-x64' || matrix.os == 'macos-latest' && 'osx-x64' }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scheduled-build-${{ matrix.os }}
        path: |
          bin-managed/
          artifacts/
        retention-days: 14
